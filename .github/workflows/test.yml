name: Test

on:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - chore/*
      - security/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-linux:
    name: (x86_64-linux-gnu) Build and run tests
    runs-on: ubuntu-latest
    env:
      CC: ${{ github.workspace }}/zigshim/cc
      CXX: ${{ github.workspace }}/zigshim/cxx
      AR: ${{ github.workspace }}/zigshim/ar
      ZIG_FLAGS: -target x86_64-linux-gnu.2.17.0
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Set up zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential pkg-config cmake ninja-build curl golang-go
          # Needed to compile 'minicurl'
          sudo apt-get install libcurl4-openssl-dev
          # More dependencies for the tests
          sudo apt-get install tcpdump nghttp2-server

      - name: Build curl-impersonate
        run: |
          set -e
          install_dir="${{ runner.temp }}/install"
          mkdir -p "$install_dir"
          cmake_args="-DCMAKE_INSTALL_PREFIX=$install_dir"
          cmake_args="$cmake_args -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=x86_64"
          cmake_args="$cmake_args -DCURL_CA_PATH=/etc/ssl/certs -DCURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt"
          make prepare-libidn2 BUILD_DIR=build
          make configure BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          make build BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          make checkbuild BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          make install BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          python3 tests/check_install.py --prefix "$install_dir"

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies for the tests script
        run: |
          pip3 install -r tests/requirements.txt

      - name: Prepare the tests
        run: |
          # Compile 'minicurl' which is used by the tests
          gcc -Wall -Werror -o ${{ runner.temp }}/install/bin/minicurl tests/minicurl.c `curl-config --libs`
          GOBIN=${{ runner.temp }}/install/bin go install github.com/wzshiming/socks5/cmd/socks5@v0.7.0

      - name: Run the tests
        run: |
          cd tests
          # sudo is needed for capturing packets
          python_bin=$(which python3)
          capture_interface=$(ip -o route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i == "dev") {print $(i+1); exit}}')
          test -n "$capture_interface"
          echo "Capturing traffic on $capture_interface"
          sudo $python_bin -m pytest . --log-cli-level DEBUG --install-dir ${{ runner.temp }}/install --capture-interface "$capture_interface"
